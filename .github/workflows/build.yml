name: Build COG Floating APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build COG Floating APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check COG project
        run: |
          echo "=== COG PROJECT ==="
          ls -la cognew
          echo "=== SETTINGS ==="
          ls -la cognew/settings.gradle
          echo "=== APP ==="
          ls -la cognew/app

      - name: Build APK
        working-directory: cognew
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          ls -lh cognew/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COG-Floating-APK
          path: cognew/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
