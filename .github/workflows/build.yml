name: Build COG Floating APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build COG Floating APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -type f -print -quit | xargs dirname)
          echo "Project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" -path "*/build/outputs/apk/debug/app-debug.apk" -type f -print -quit)
          echo "APK found at: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COG-Floating-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
